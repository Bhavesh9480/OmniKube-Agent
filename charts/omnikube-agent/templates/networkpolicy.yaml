{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "omnikube-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omnikube-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "omnikube-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming API and WebSocket requests on port 9999
    - from: []
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # Allow egress to Kubernetes API server (port 443 / 6443)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
