{{- if .Values.rbac.create -}}
{{- if .Values.rbac.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "omnikube-agent.fullname" . }}
  labels:
    {{- include "omnikube-agent.labels" . | nindent 4 }}
rules:
  # Core API group: read-only access to pods, services, events, nodes, and pvcs
  - apiGroups: [""]
    resources:
      - pods
      - services
      - events
      - nodes
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch

  # Apps API group: read-only access to deployments and statefulsets
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch

  # Discovery API group: read-only access to endpointslices
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch

  # Core API subresource: read-only access to pod logs for crash diagnostics
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get

  # Coordination API group: leases for leader election HA
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update

  # Metrics Server API group: read-only access to live CPU and memory utilization
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "omnikube-agent.fullname" . }}
  labels:
    {{- include "omnikube-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "omnikube-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "omnikube-agent.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "omnikube-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omnikube-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - events
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "omnikube-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omnikube-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "omnikube-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "omnikube-agent.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
