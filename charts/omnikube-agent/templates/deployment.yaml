apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omnikube-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omnikube-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "omnikube-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "omnikube-agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "omnikube-agent.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: APP_MODE
              value: {{ .Values.config.appMode | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: RECONCILIATION_INTERVAL_SECONDS
              value: {{ .Values.config.reconciliationIntervalSeconds | quote }}
            - name: EVENT_BUFFER_MAX_AGE_MINUTES
              value: {{ .Values.config.eventBufferMaxAgeMinutes | quote }}
            - name: CACHE_STALE_THRESHOLD_SECONDS
              value: {{ .Values.config.cacheStaleThresholdSeconds | quote }}
            - name: WATCH_NAMESPACES
              value: {{ .Values.config.watchNamespaces | quote }}
            - name: ENABLE_LEADER_ELECTION
              value: {{ .Values.config.leaderElection.enabled | quote }}
            - name: LEADER_ELECTION_LEASE_NAME
              value: {{ .Values.config.leaderElection.leaseName | quote }}
            - name: LEADER_ELECTION_DURATION_SECONDS
              value: {{ .Values.config.leaderElection.durationSeconds | quote }}
            - name: LEADER_ELECTION_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir:
            medium: Memory
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
