apiVersion: v1
kind: Service
metadata:
  name: k8s-monitoring-agent
  namespace: default
  labels:
    app.kubernetes.io/name: k8s-monitoring-agent
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: k8s-monitoring-agent
  ports:
    - name: http
      port: 9999
      targetPort: http
      protocol: TCP
