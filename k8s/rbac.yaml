apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-monitoring-agent
  labels:
    app.kubernetes.io/name: k8s-monitoring-agent
    app.kubernetes.io/component: monitoring
rules:
  # Core API group: read-only access to pods, services, events, nodes, and PVCs
  - apiGroups: [""]
    resources:
      - pods
      - services
      - events
      - nodes
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch

  # Apps API group: read-only access to deployments and statefulsets
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch

  # Discovery API group: read-only access to endpointslices
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch

  # Coordination API group: access to leases for leader election HA
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update

  # Core API subresource: read-only access to pod logs for crash diagnostics
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get

  # Metrics Server API group: read-only access to live CPU and memory utilization
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-monitoring-agent-binding
  labels:
    app.kubernetes.io/name: k8s-monitoring-agent
    app.kubernetes.io/component: monitoring
subjects:
  - kind: ServiceAccount
    name: k8s-monitoring-agent
    namespace: default
roleRef:
  kind: ClusterRole
  name: k8s-monitoring-agent
  apiGroup: rbac.authorization.k8s.io
