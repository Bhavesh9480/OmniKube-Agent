apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-monitoring-agent
  labels:
    app.kubernetes.io/name: k8s-monitoring-agent
    app.kubernetes.io/component: monitoring
rules:
  # Core API group: read-only access to pods, services, and events
  - apiGroups: [""]
    resources:
      - pods
      - services
      - events
    verbs:
      - get
      - list
      - watch

  # Apps API group: read-only access to deployments
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch

  # Discovery API group: read-only access to endpointslices
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-monitoring-agent-binding
  labels:
    app.kubernetes.io/name: k8s-monitoring-agent
    app.kubernetes.io/component: monitoring
subjects:
  - kind: ServiceAccount
    name: k8s-monitoring-agent
    namespace: default
roleRef:
  kind: ClusterRole
  name: k8s-monitoring-agent
  apiGroup: rbac.authorization.k8s.io
